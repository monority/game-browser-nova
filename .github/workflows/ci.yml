name: CI

# Continuous integration for NOVA (docs/DEVELOPMENT.md §CI).
# One job, the same gate order as docs/VALIDATION.md:
#   install -> typecheck -> lint -> audit -> unit -> probe -> build -> e2e
# The E2E step runs against the dev server (same command as local) so the
# browser journeys are identical to a developer run; the production
# bundle is validated by the separate build step.
# Actions are pinned to commit SHAs (kept fresh by .github/dependabot.yml)
# so a moved tag cannot silently change what runs here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, audit, unit, probe, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `pnpm check` runs this too; CI replays the steps one by one, so the
      # audit needs its own step or the gate exists only locally.
      - name: Test vacuity audit
        run: pnpm test:audit

      - name: Unit tests
        run: pnpm test

      # Six journeys through the cockpit (idle hold, labour ceiling, farm repair,
      # famine, save resume, determinism) — 4.1 s measured, so the gate that
      # catches "the game stopped being a game" is cheap enough to run every push.
      - name: Scenario playtests
        run: pnpm test:scenarios

      # The probe reports whether the suite can still fail; the full table
      # (70 mutations in 12 batches, ~10 min) stays a local measurement, so CI
      # runs the five marked core laws (28.9-33.2 s measured). Without this step
      # the probe is the only instrument in the repository that nothing ever
      # triggers — which is why it went five pushes calling every mutation BROKE
      # before the verdict moved from Vitest's console text to its JSON report.
      - name: Core mutation probe
        run: pnpm test:mutations:fast

      - name: Production build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e

      # A red E2E step records only "exit code 1": the journey's name lives in the
      # artifact, which needs an authenticated download, so runs 95 and 97 were red
      # with no public way to say which of the 17 journeys broke. Workflow commands
      # become annotations, which are readable without a token.
      - name: Name the failing journeys
        if: failure()
        run: node tools/testing/report-e2e-failures.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
